spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: case-server

  cloud:
    stream:
      bindings:
        publishCaseImport-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}case.import
      output-bindings: publishCaseImport-out-0

powsybl-ws:
  database:
    name: case_metadata

cleaning-cases-cron: 0 0 2 * * ?

case-subpath: cases
